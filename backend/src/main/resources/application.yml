spring:
  application:
    name: taskmanager

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${DB_USERNAME:taskmanager}
    password: ${DB_PASSWORD:taskmanager}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    # segredo default apenas para desenvolvimento local; em producao sobrescreva via JWT_SECRET
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-com-no-minimo-32-bytes}
    expiration: PT8H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
