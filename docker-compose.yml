services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmanager-postgres
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: taskmanager-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/taskmanager
      DB_USERNAME: taskmanager
      DB_PASSWORD: taskmanager
      # defaults de desenvolvimento; sobrescreva via .env ou ambiente em producao
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao-com-no-minimo-32-bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: taskmanager-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
