<h2 mat-dialog-title>Membros do projeto</h2>

<mat-dialog-content>
  <mat-list class="member-list">
    @for (member of members(); track member.userId) {
      <mat-list-item>
        <span matListItemTitle>{{ member.name }}</span>
        <span matListItemLine>{{ member.email }} &middot; {{ member.role }}</span>
        <button
          mat-icon-button
          matListItemMeta
          type="button"
          aria-label="Remover membro"
          [disabled]="isOwner(member)"
          [title]="isOwner(member) ? 'O dono do projeto nao pode ser removido' : 'Remover membro'"
          (click)="remove(member)"
        >
          <mat-icon>person_remove</mat-icon>
        </button>
      </mat-list-item>
    }
  </mat-list>

  <form [formGroup]="form" class="member-form">
    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Papel no projeto</mat-label>
      <mat-select formControlName="role">
        @for (role of roles; track role) {
          <mat-option [value]="role">{{ role }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="add()">
      Adicionar
    </button>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Fechar</button>
</mat-dialog-actions>
